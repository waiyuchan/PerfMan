<text x="45" y="55" text-anchor="start" class="sans" font-size="30" fill="#1f2937">
<tspan x="45" dy="0">PerfMan Studio · Local runtime</tspan>
</text>
<text x="46" y="90" text-anchor="start" class="sans" font-size="13" fill="#64748b">
<tspan x="46" dy="0">Delivered implementation · no external database, registry or config server required</tspan>
</text>
<text x="373" y="171" text-anchor="start" class="sans" font-size="22" fill="#1971c2">
<tspan x="373" dy="0">Single Go process</tspan>
</text>
<text x="373" y="193" text-anchor="start" class="mono" font-size="11" fill="#64748b">
<tspan x="373" dy="0">Logical modules share one process · Runner can be extracted later</tspan>
</text>
<text x="155" y="292" text-anchor="middle" class="sans" font-size="18" fill="#1f2937">
<tspan x="155" dy="0">Web console</tspan>
</text>
<text x="155" y="313" text-anchor="middle" class="mono" font-size="12" fill="#64748b">
<tspan x="155" dy="0">HTML / CSS / JavaScript</tspan>
</text>
<text x="530" y="292" text-anchor="middle" class="sans" font-size="18" fill="#1f2937">
<tspan x="530" dy="0">Control modules</tspan>
</text>
<text x="530" y="313" text-anchor="middle" class="mono" font-size="12" fill="#64748b">
<tspan x="530" dy="0">Projects · Scenarios · Runs</tspan>
</text>
<text x="865" y="292" text-anchor="middle" class="sans" font-size="18" fill="#1f2937">
<tspan x="865" dy="0">HTTP runner</tspan>
</text>
<text x="865" y="313" text-anchor="middle" class="mono" font-size="12" fill="#64748b">
<tspan x="865" dy="0">VU stages · cancel · histogram</tspan>
</text>
<text x="1210" y="292" text-anchor="middle" class="sans" font-size="18" fill="#1f2937">
<tspan x="1210" dy="0">Demo target</tspan>
</text>
<text x="1210" y="313" text-anchor="middle" class="mono" font-size="12" fill="#64748b">
<tspan x="1210" dy="0">Normal / bottleneck responses</tspan>
</text>
<text x="530" y="462" text-anchor="middle" class="sans" font-size="18" fill="#1f2937">
<tspan x="530" dy="0">Reports / k6 export</tspan>
</text>
<text x="530" y="483" text-anchor="middle" class="mono" font-size="12" fill="#64748b">
<tspan x="530" dy="0">JSON · CSV · printable compare</tspan>
</text>
<text x="565" y="657" text-anchor="middle" class="sans" font-size="18" fill="#1f2937">
<tspan x="565" dy="0">Atomic JSON state</tspan>
</text>
<text x="565" y="678" text-anchor="middle" class="mono" font-size="12" fill="#64748b">
<tspan x="565" dy="0">data/state.json · final results</tspan>
</text>
<text x="273" y="295" text-anchor="start" class="mono" font-size="11" fill="#1971c2">
<tspan x="273" dy="0">HTTP JSON + polling</tspan>
</text>
<text x="665" y="296" text-anchor="start" class="mono" font-size="11" fill="#1971c2">
<tspan x="665" dy="0">Start / cancel</tspan>
</text>
<text x="1000.5" y="296" text-anchor="start" class="mono" font-size="11" fill="#1971c2">
<tspan x="1000.5" dy="0">HTTP requests</tspan>
</text>
<text x="548" y="401" text-anchor="start" class="mono" font-size="11" fill="#1971c2">
<tspan x="548" dy="0">Read snapshot / result</tspan>
</text>
<text x="85" y="531" text-anchor="start" class="sans" font-size="11" fill="#1971c2">
<tspan x="85" dy="0">fsync + atomic rename</tspan>
</text>
<text x="800" y="445" text-anchor="start" class="sans" font-size="15" fill="#64748b">
<tspan x="800" dy="0">Runner collects per-request histograms and 1s windows.</tspan>
<tspan x="800" dy="18.75">SLA can cancel a run; completion and verdict are separate.</tspan>
<tspan x="800" dy="18.75">Restarted active runs are marked interrupted.</tspan>
</text>
<text x="800" y="644" text-anchor="start" class="sans" font-size="14" fill="#64748b">
<tspan x="800" dy="0">Local storage is a demo choice, not an HA database.</tspan>
<tspan x="800" dy="17.5">Metrics persist at completion; a crash can lose active samples.</tspan>
<tspan x="800" dy="17.5">Showcase hosting uses synthetic browser data only.</tspan>
</text>
<text x="172.5" y="779.2" text-anchor="middle" class="sans" font-size="12" fill="#1f2937">
<tspan x="172.5" dy="0">Blue solid = verified implementation</tspan>
</text>
<text x="350" y="772" text-anchor="start" class="sans" font-size="12" fill="#64748b">
<tspan x="350" dy="0">Solid blue arrow: execution / persistence   ·   Dotted blue arrow: read-only projection</tspan>
</text>
</svg>
