<tspan x="265" dy="17.4">Workers, clusters and Pods</tspan>
<tspan x="265" dy="17.4">Probe, drain and disconnect</tspan>
<tspan x="265" dy="17.4">Simulated group autoscaling</tspan>
</text>
<text x="745" y="490" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="745" dy="0">Run orchestration</tspan>
</text>
<text x="745" y="511" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
