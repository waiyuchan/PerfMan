<tspan x="745" dy="17.4">Regional shards + start barrier</tspan>
<tspan x="745" dy="17.4">Lease, heartbeat and cancellation</tspan>
<tspan x="745" dy="17.4">Frozen bundles + resource release</tspan>
</text>
<text x="1225" y="490" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="1225" dy="0">Monitoring &amp; investigation</tspan>
</text>
<text x="1225" y="511" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
<tspan x="1225" dy="0">Request / latency / error series</tspan>
<tspan x="1225" dy="17.4">Service, script and region views</tspan>
<tspan x="1225" dy="17.4">Samples, extraction, checks and logs</tspan>
<tspan x="1225" dy="17.4">Worker allocation and utilization</tspan>
</text>
<text x="265" y="735" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="265" dy="0">Quality &amp; reporting</tspan>
</text>
<text x="265" y="756" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
<tspan x="265" dy="0">Consecutive-window SLA rules</tspan>
<tspan x="265" dy="17.4">Protection stops and notifications</tspan>
<tspan x="265" dy="17.4">Baselines and report comparison</tspan>
<tspan x="265" dy="17.4">JSON / CSV / print-to-PDF</tspan>
