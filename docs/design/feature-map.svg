<tspan x="745" dy="17.4">JavaScript modules + lifecycle</tspan>
<tspan x="745" dy="17.4">JMX plans + thread groups</tspan>
<tspan x="745" dy="17.4">VU / RPS / ramp / spike profiles</tspan>
</text>
<text x="1225" y="245" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="1225" dy="0">Data &amp; configuration</tspan>
</text>
<text x="1225" y="266" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
<tspan x="1225" dy="0">CSV parameters and partitions</tspan>
<tspan x="1225" dy="17.4">Environment variables + secrets</tspan>
<tspan x="1225" dy="17.4">Protocol bundles and script modules</tspan>
<tspan x="1225" dy="17.4">JMX and plugin dependencies</tspan>
</text>
<text x="265" y="490" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="265" dy="0">Resource fleet</tspan>
</text>
<text x="265" y="511" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
