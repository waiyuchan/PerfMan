<tspan x="745" dy="17.4">HAR import and managed capture</tspan>
<tspan x="745" dy="17.4">Convert captured traffic to a test</tspan>
</text>
<text x="1225" y="735" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="1225" dy="0">Operations &amp; governance</tspan>
</text>
<text x="1225" y="756" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
<tspan x="1225" dy="0">Audited virtual Pod terminal</tspan>
<tspan x="1225" dy="17.4">Contacts, delivery inbox and retry</tspan>
<tspan x="1225" dy="17.4">People, tags and integrations</tspan>
<tspan x="1225" dy="17.4">English / Chinese preferences</tspan>
</text>
<text x="47" y="1000" text-anchor="start" class="sans" font-size="15" fill="#64748b">
<tspan x="47" dy="0">Blue solid cards = implemented product domains. This is a functional grouping, not a deployment diagram.</tspan>
<tspan x="47" dy="18.75">Execution boundary: managed workers / Pods / terminal and protocol fixtures; native HTTP measures the bundled local target.</tspan>
