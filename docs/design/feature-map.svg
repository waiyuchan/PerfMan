<text x="45" y="58" text-anchor="start" class="sans" font-size="32" fill="#1f2937">
<tspan x="45" dy="0">PerfMan · Product capability map</tspan>
</text>
<text x="47" y="104" text-anchor="start" class="sans" font-size="16" fill="#64748b">
<tspan x="47" dy="0">DESIGN VIEW · Author tests, coordinate resources, investigate results and operate the workspace</tspan>
</text>
<text x="47" y="160" text-anchor="start" class="sans" font-size="15" fill="#1f2937">
<tspan x="47" dy="0">Administrator: workspace + access  ·  Engineer: author + run  ·  Operator: fleet + terminal  ·  Viewer: review</tspan>
</text>
<text x="265" y="245" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
<tspan x="265" dy="0">Workspace &amp; access</tspan>
</text>
<text x="265" y="266" text-anchor="middle" class="mono" font-size="15" fill="#64748b">
<tspan x="265" dy="0">Projects and membership</tspan>
<tspan x="265" dy="17.4">Admin / Engineer / Operator / Viewer</tspan>
<tspan x="265" dy="17.4">Project + tag policies</tspan>
<tspan x="265" dy="17.4">Session and audit history</tspan>
</text>
<text x="745" y="245" text-anchor="middle" class="sans" font-size="21" fill="#1f2937">
