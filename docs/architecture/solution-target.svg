</text>
<text x="1300" y="491" text-anchor="middle" class="sans" font-size="17" fill="#1f2937">
<tspan x="1300" dy="0">Engine adapters</tspan>
</text>
<text x="1300" y="512" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
<tspan x="1300" dy="0">Script / HTTP / protocols / JMeter</tspan>
</text>
<text x="1177.5" y="716" text-anchor="middle" class="sans" font-size="17" fill="#1f2937">
<tspan x="1177.5" dy="0">Resource providers</tspan>
</text>
<text x="1177.5" y="737" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
<tspan x="1177.5" dy="0">Simulator / Agent / Docker / K8s</tspan>
</text>
<text x="1422.5" y="716" text-anchor="middle" class="sans" font-size="17" fill="#1f2937">
<tspan x="1422.5" dy="0">Target transports</tspan>
</text>
<text x="1422.5" y="737" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
<tspan x="1422.5" dy="0">Fixtures or authorised endpoints</tspan>
</text>
