<text x="40" y="55" text-anchor="start" class="sans" font-size="30" fill="#1f2937">
<tspan x="40" dy="0">PerfMan Go · Complete solution design</tspan>
</text>
<text x="42" y="94" text-anchor="start" class="sans" font-size="14" fill="#64748b">
<tspan x="42" dy="0">PROPOSAL · Expanded scope after PTS feature review · all green dashed modules are planned</tspan>
</text>
<text x="348" y="186" text-anchor="start" class="sans" font-size="22" fill="#2f9e44">
<tspan x="348" dy="0">Go control plane</tspan>
</text>
<text x="348" y="208" text-anchor="start" class="mono" font-size="11" fill="#64748b">
<tspan x="348" dy="0">One modular service first / server-owned durable workflow</tspan>
</text>
<text x="1048" y="186" text-anchor="start" class="sans" font-size="22" fill="#2f9e44">
<tspan x="1048" dy="0">Execution + provider plane</tspan>
</text>
<text x="1048" y="208" text-anchor="start" class="mono" font-size="11" fill="#64748b">
<tspan x="1048" dy="0">Bounded simulator first / replaceable real adapters</tspan>
</text>
<text x="145" y="316" text-anchor="middle" class="sans" font-size="17" fill="#1f2937">
<tspan x="145" dy="0">Bilingual web console</tspan>
</text>
<text x="145" y="337" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
