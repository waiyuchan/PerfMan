</text>
<text x="775" y="681" text-anchor="middle" class="sans" font-size="17" fill="#1f2937">
<tspan x="775" dy="0">Operations gateway</tspan>
</text>
<text x="775" y="702" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
<tspan x="775" dy="0">SLA / notifications / terminal / audit</tspan>
</text>
