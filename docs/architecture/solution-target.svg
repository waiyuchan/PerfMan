</text>
<text x="490" y="297" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
<tspan x="490" dy="0">Sessions / roles / project + tag scope</tspan>
</text>
<text x="775" y="276" text-anchor="middle" class="sans" font-size="17" fill="#1f2937">
<tspan x="775" dy="0">Projects + assets</tspan>
</text>
<text x="775" y="297" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
<tspan x="775" dy="0">Environments / files / recordings</tspan>
</text>
<text x="635" y="456" text-anchor="middle" class="sans" font-size="17" fill="#1f2937">
<tspan x="635" dy="0">Run + resource scheduler</tspan>
</text>
<text x="635" y="477" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
