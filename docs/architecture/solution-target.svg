</text>
<text x="860" y="1021" text-anchor="middle" class="sans" font-size="17" fill="#1f2937">
<tspan x="860" dy="0">Versioned artifact store</tspan>
</text>
<text x="860" y="1042" text-anchor="middle" class="mono" font-size="11" fill="#64748b">
<tspan x="860" dy="0">Local content-addressed / object storage</tspan>
</text>
<text x="45" y="236" text-anchor="start" class="sans" font-size="11" fill="#2f9e44">
<tspan x="45" dy="0">HTTP / session / policy</tspan>
</text>
<text x="505" y="393.5" text-anchor="start" class="mono" font-size="11" fill="#2f9e44">
<tspan x="505" dy="0">Authorise actions</tspan>
</text>
<text x="790" y="393.5" text-anchor="start" class="mono" font-size="11" fill="#868e96">
<tspan x="790" dy="0">Freeze bundle</tspan>
</text>
