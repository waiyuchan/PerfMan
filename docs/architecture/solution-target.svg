<tspan x="895" dy="0">Assignment / epoch / cancel</tspan>
</text>
<text x="1315" y="411" text-anchor="start" class="mono" font-size="11" fill="#2f9e44">
<tspan x="1315" dy="0">Start / update / collect</tspan>
</text>
<text x="1050" y="826" text-anchor="start" class="sans" font-size="11" fill="#2f9e44">
<tspan x="1050" dy="0">Provision / observe / release resources</tspan>
</text>
<text x="1437" y="621" text-anchor="start" class="sans" font-size="11" fill="#2f9e44">
<tspan x="1437" dy="0">Invoke protocols</tspan>
</text>
<text x="642" y="593" text-anchor="start" class="mono" font-size="11" fill="#e67700">
<tspan x="642" dy="0">Metric batch / log / sample</tspan>
</text>
<text x="615" y="776" text-anchor="start" class="sans" font-size="11" fill="#64748b">
<tspan x="615" dy="0">SLA / report events → operations</tspan>
<tspan x="615" dy="13.75">Notifications + terminal sessions audited</tspan>
</text>
<text x="45" y="817" text-anchor="start" class="sans" font-size="12" fill="#2f9e44">
<tspan x="45" dy="0">Task state + outbox</tspan>
<tspan x="45" dy="15">transactional persistence</tspan>
</text>
<text x="1060" y="952" text-anchor="start" class="sans" font-size="12" fill="#2f9e44">
<tspan x="1060" dy="0">Versioned content / immutable file hashes</tspan>
</text>
<text x="1070" y="1008" text-anchor="start" class="sans" font-size="13" fill="#64748b">
<tspan x="1070" dy="0">Simulator: persistent pods, leases and virtual terminal.</tspan>
<tspan x="1070" dy="16.25">Real adapters: agents, Docker, Kubernetes, SSH.</tspan>
<tspan x="1070" dy="16.25">Metrics retain measured / simulated provenance.</tspan>
<tspan x="1070" dy="16.25">JMeter keeps its JVM; orchestration is Go.</tspan>
</text>
<text x="190" y="1171.7" text-anchor="middle" class="sans" font-size="12" fill="#1f2937">
<tspan x="190" dy="0">Green dashed = proposed component</tspan>
</text>
<text x="380" y="1157" text-anchor="start" class="sans" font-size="12" fill="#64748b">
<tspan x="380" dy="0">Green solid: call / persistence    Orange dashed: asynchronous handoff / events</tspan>
<tspan x="380" dy="15">Gray dotted: read-only snapshot lookup    This design supersedes the earlier HTTP-only target scope.</tspan>
</text>
